<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Slanted Room / Canopy Line -->
  <path d="M7 20L24 7L41 20" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Computer Monitor Screen -->
  <rect x="14" y="15" width="20" height="14" rx="2.5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <!-- Graphic on Screen (Coral Red) -->
  <circle cx="24" cy="21.5" r="3.5" fill="#e84141"/>
  <path d="M24 17C25 17 25.5 17.5 25 18.5" fill="none" stroke="#1e293b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Monitor Stand -->
  <path d="M21 32H27M24 29V32" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Coral Red Coffee Cup with Steam -->
  <rect x="29.5" y="26" width="4" height="6" rx="1" fill="#e84141" stroke="#1e293b" stroke-width="1.6"/>
  <path d="M33.5 28C34.8 28 34.8 30 33.5 30" fill="none" stroke="#1e293b" stroke-width="1.3"/>
  <path d="M31.5 23.5C31.5 21.5 32.5 21.5 32.5 19.5" fill="none" stroke="#e84141" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Desk Top -->
  <rect x="9" y="32" width="30" height="3" rx="1.5" fill="#1e293b"/>
  <!-- Desk Modesty / Drawer Panel (Soft Light Blue) -->
  <rect x="11" y="35" width="26" height="5.5" rx="1" fill="#70a9dc" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="15" cy="37.8" r="0.8" fill="#1e293b"/>
  <!-- Desk Legs -->
  <line x1="12.5" y1="40.5" x2="12.5" y2="43" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="35.5" y1="40.5" x2="35.5" y2="43" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Ground Line -->
  <line x1="6" y1="43" x2="42" y2="43" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
</svg>
