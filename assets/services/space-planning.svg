  <!-- Highlighted Zone 2: Living / Lounge Area (Soft Sky Blue) -->
  <rect x="26.5" y="26.5" width="12" height="12" rx="1" fill="#70a9dc" stroke="#1e293b" stroke-width="1.8"/>
  
  <!-- Highlighted Zone 3: Kitchen / Utility (Warm Yellow) -->
  <rect x="9.5" y="27.5" width="9" height="11" rx="1" fill="#f5c542" stroke="#1e293b" stroke-width="1.8"/>
  
